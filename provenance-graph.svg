<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" fill="none">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B132B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Left: Source Ingestion Documents -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <rect width="220" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="220" height="40" rx="10" fill="#F8FAFC"/>
    <rect y="30" width="220" height="10" fill="#F8FAFC"/>
    <text x="20" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B">Source Records</text>
    
    <!-- Item 1: Contract Spec -->
    <g transform="translate(15, 55)">
      <rect width="190" height="48" rx="6" fill="#F1F5F9"/>
      <circle cx="15" cy="24" r="4" fill="#00A896"/>
      <text x="28" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Contract Sec. 00700</text>
      <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#64748B">Notice within 10 days</text>
    </g>

    <!-- Item 2: Schedule Update -->
    <g transform="translate(15, 115)">
      <rect width="190" height="48" rx="6" fill="#F1F5F9"/>
      <circle cx="15" cy="24" r="4" fill="#00A896"/>
      <text x="28" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Baseline Schedule (XER)</text>
      <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#64748B">Activity A1040 Critical Path</text>
    </g>

    <!-- Item 3: RFI Log -->
    <g transform="translate(15, 175)">
      <rect width="190" height="48" rx="6" fill="#F1F5F9"/>
      <circle cx="15" cy="24" r="4" fill="#00A896"/>
      <text x="28" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">RFI #042 Response</text>
      <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#64748B">Received Day 45 (Late 18d)</text>
    </g>

    <!-- Item 4: Daily Log -->
    <g transform="translate(15, 235)">
      <rect width="190" height="34" rx="6" fill="#F1F5F9"/>
      <circle cx="15" cy="17" r="4" fill="#00A896"/>
      <text x="28" y="21" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0F172A">Superintendent Daily Log</text>
    </g>
  </g>

  <!-- Middle: Provenance Graph & Deterministic Analysis -->
  <g transform="translate(320, 40)" filter="url(#shadow)">
    <rect width="260" height="280" rx="10" fill="#0B132B" stroke="#1C2541" stroke-width="1.5"/>
    <text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Traceability Engine</text>
    <text x="20" y="48" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Deterministic &amp; AI-Assisted Graph</text>
    
    <!-- Central Node Cluster -->
    <g transform="translate(30, 80)">
      <!-- Connections -->
      <path d="M 30 30 L 100 80 M 30 110 L 100 80 M 100 80 L 170 40 M 100 80 L 170 120" stroke="#334155" stroke-width="2"/>
      <path d="M 30 30 L 100 80" stroke="#00A896" stroke-width="2" stroke-dasharray="3 3"/>
      
      <!-- Nodes -->
      <circle cx="30" cy="30" r="16" fill="#1C2541" stroke="#00A896" stroke-width="2"/>
      <text x="30" y="34" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">REQ</text>
      
      <circle cx="30" cy="110" r="16" fill="#1C2541" stroke="#48CAE4" stroke-width="2"/>
      <text x="30" y="114" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">EVD</text>
      
      <circle cx="100" cy="80" r="22" fill="#00A896" stroke="#FFFFFF" stroke-width="2"/>
      <text x="100" y="83" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">EVAL</text>
      <text x="100" y="93" font-family="Inter, system-ui, sans-serif" font-size="7.5" fill="#E6FFFA" text-anchor="middle">MATCH</text>
      
      <circle cx="170" cy="40" r="16" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="170" y="44" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">DISC</text>
      
      <circle cx="170" cy="120" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="170" y="124" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">FACT</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="235" width="220" height="30" rx="6" fill="#1C2541"/>
    <text x="130" y="254" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64DFDF" text-anchor="middle">Immutable Source Provenance</text>
  </g>

  <!-- Right: Synthesized Findings & Human Decision Support -->
  <g transform="translate(640, 40)" filter="url(#shadow)">
    <rect width="220" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="220" height="40" rx="10" fill="#F8FAFC"/>
    <rect y="30" width="220" height="10" fill="#F8FAFC"/>
    <text x="20" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B">Decision Support</text>
    
    <!-- Finding Card 1 -->
    <g transform="translate(15, 55)">
      <rect width="190" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect width="4" height="70" rx="2" fill="#EF4444"/>
      <text x="14" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B132B">Finding: Untimely Notice</text>
      <text x="14" y="34" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B">RFI #042 delay not cited</text>
      <text x="14" y="46" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B">within contractual 10d.</text>
      <text x="14" y="60" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#00A896">Citations: Doc #1, #3</text>
    </g>

    <!-- Finding Card 2 -->
    <g transform="translate(15, 135)">
      <rect width="190" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect width="4" height="65" rx="2" fill="#F59E0B"/>
      <text x="14" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0B132B">Risk: 28-Day Schedule Float</text>
      <text x="14" y="34" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B">Erosion on Building A path.</text>
      <text x="14" y="52" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#00A896">Citations: Schedule B3</text>
    </g>

    <!-- Human Review Badge -->
    <g transform="translate(15, 210)">
      <rect width="190" height="55" rx="6" fill="#E6FFFA" stroke="#00A896" stroke-width="1"/>
      <text x="95" y="24" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#00A896" text-anchor="middle">HUMAN REVIEW</text>
      <text x="95" y="42" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Expert verification &amp; judgment</text>
    </g>
  </g>

  <!-- Connectors between columns -->
  <line x1="260" y1="180" x2="320" y2="180" stroke="#00A896" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="580" y1="180" x2="640" y2="180" stroke="#00A896" stroke-width="2" stroke-dasharray="4 2"/>
</svg>

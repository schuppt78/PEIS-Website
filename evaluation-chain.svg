<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="nodeGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
    <linearGradient id="nodeGradWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B132B" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00A896"/>
    </marker>
  </defs>

  <!-- Flow connecting spine -->
  <line x1="100" y1="130" x2="1100" y2="130" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- 1. SOURCE -->
  <g transform="translate(30, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#F8FAFC"/>
    <rect x="0" y="22" width="115" height="10" fill="#F8FAFC"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STAGE 01</text>
    <circle cx="57" cy="65" r="18" fill="#F1F5F9"/>
    <path d="M50 58 h14 v14 h-14 z M53 62 h8 M53 66 h5" stroke="#0B132B" stroke-width="1.5" fill="none"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Source</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Contracts, RFIs,</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Schedules, Memos</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="150" y1="130" x2="175" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. REQUIREMENT -->
  <g transform="translate(180, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#F8FAFC"/>
    <rect x="0" y="22" width="115" height="10" fill="#F8FAFC"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STAGE 02</text>
    <circle cx="57" cy="65" r="18" fill="#F1F5F9"/>
    <path d="M50 60 l4 4 l10 -10" stroke="#00A896" stroke-width="2" fill="none"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Requirement</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Clauses, Specs,</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Notice Timelines</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="300" y1="130" x2="325" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. EVIDENCE -->
  <g transform="translate(330, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#F8FAFC"/>
    <rect x="0" y="22" width="115" height="10" fill="#F8FAFC"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STAGE 03</text>
    <circle cx="57" cy="65" r="18" fill="#F1F5F9"/>
    <circle cx="57" cy="65" r="7" stroke="#0B132B" stroke-width="1.5" fill="none"/>
    <line x1="62" y1="70" x2="68" y2="76" stroke="#0B132B" stroke-width="2"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Evidence</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Chronology Dates,</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Direct Citations</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="450" y1="130" x2="475" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. EVALUATION -->
  <g transform="translate(480, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#00A896" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#E6FFFA"/>
    <rect x="0" y="22" width="115" height="10" fill="#E6FFFA"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#00A896" text-anchor="middle">STAGE 04</text>
    <circle cx="57" cy="65" r="18" fill="#E6FFFA"/>
    <path d="M50 65 h14 M57 58 v14" stroke="#00A896" stroke-width="1.8"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Evaluation</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Rule-Based &amp; AI</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Compliance Mapping</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="600" y1="130" x2="625" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. CONTRADICTION -->
  <g transform="translate(630, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#FEF3C7"/>
    <rect x="0" y="22" width="115" height="10" fill="#FEF3C7"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">STAGE 05</text>
    <circle cx="57" cy="65" r="18" fill="#FEF3C7"/>
    <path d="M52 70 l5 -12 l5 12 z M57 65 v2" stroke="#D97706" stroke-width="1.5" fill="none"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Contradiction</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Discrepancy &amp;</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Conflict Flags</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="750" y1="130" x2="775" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. FINDING -->
  <g transform="translate(780, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#F8FAFC"/>
    <rect x="0" y="22" width="115" height="10" fill="#F8FAFC"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">STAGE 06</text>
    <circle cx="57" cy="65" r="18" fill="#F1F5F9"/>
    <path d="M50 59 h14 v12 h-14 z M54 63 l2 2 l4 -4" stroke="#0B132B" stroke-width="1.5" fill="none"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Finding</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Evidence-Supported</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Factual Synthesis</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="900" y1="130" x2="925" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. RISK -->
  <g transform="translate(930, 60)" filter="url(#cardShadow)">
    <rect width="115" height="140" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="0" y="0" width="115" height="32" rx="10" fill="#FFEDD5"/>
    <rect x="0" y="22" width="115" height="10" fill="#FFEDD5"/>
    <text x="57" y="21" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">STAGE 07</text>
    <circle cx="57" cy="65" r="18" fill="#FFEDD5"/>
    <path d="M57 56 v10 M57 70 v1.5" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
    <text x="57" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B132B" text-anchor="middle">Risk</text>
    <text x="57" y="123" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Cost / Delay &amp;</text>
    <text x="57" y="135" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Dispute Exposure</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="1050" y1="130" x2="1065" y2="130" stroke="#00A896" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. DECISION (Human In The Loop) -->
  <g transform="translate(1070, 48)" filter="url(#cardShadow)">
    <rect width="125" height="164" rx="12" fill="#0B132B" stroke="#00A896" stroke-width="2"/>
    <rect x="0" y="0" width="125" height="34" rx="12" fill="#1C2541"/>
    <rect x="0" y="24" width="125" height="10" fill="#1C2541"/>
    <text x="62" y="22" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" fill="#00A896" text-anchor="middle">STAGE 08 • FINAL</text>
    <circle cx="62" cy="72" r="20" fill="#028090"/>
    <!-- User/Judge/Leader Icon -->
    <circle cx="62" cy="68" r="6" fill="#FFFFFF"/>
    <path d="M52 82 c0 -6 5 -9 10 -9 s10 3 10 9" fill="#FFFFFF"/>
    <text x="62" y="116" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Decision</text>
    <text x="62" y="134" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64DFDF" text-anchor="middle">Human Review</text>
    <text x="62" y="148" font-family="Inter, system-ui, sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">&amp; Final Authority</text>
  </g>

  <!-- Bottom Revalidation Feedback Loop Indicator -->
  <g transform="translate(200, 245)">
    <rect x="0" y="0" width="800" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 50 15 C 30 15 20 25 20 35 C 20 45 30 45 40 45 L 750 45 C 770 45 780 35 780 25 C 780 15 770 15 750 15" fill="none" stroke="#00A896" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="400" y="26" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0B132B" text-anchor="middle">Continuous Provenance &amp; Dependency-Aware Revalidation</text>
    <text x="400" y="40" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">When upstream source records or facts change, downstream evaluations and findings are re-evaluated</text>
  </g>
</svg>
